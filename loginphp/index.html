<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Animated · Separate CSS & JS</title>
    <!-- ===== separate CSS ===== -->
    <link rel="stylesheet" href="style.css" />
    <!-- Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

    <!-- ===== MAIN LOGIN CARD ===== -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- header -->
            <div class="login-header">
                <div class="icon-avatar">
                    <i class="fas fa-user-astronaut"></i>
                </div>
                <h1>Welcome back</h1>
                <p class="subhead">sign in to continue</p>
            </div>

            <!-- login form -->
            <form id="loginForm" action="#" method="POST">
                <!-- email -->
                <div class="form-group">
                    <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-circle"></i>
                        <input type="email" id="loginEmail" placeholder="you@example.com" value="demo@project.com" required />
                    </div>
                </div>

                <!-- password -->
                <div class="form-group">
                    <label for="loginPassword"><i class="fas fa-key"></i> Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••" value="password123" required />
                        <button type="button" class="toggle-password" id="togglePassBtn" aria-label="Show password">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- remember + forgot -->
                <div class="form-extra">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe" checked /> Remember me
                    </label>
                    <a href="#" id="forgotLink">Forgot password?</a>
                </div>

                <!-- submit -->
                <button type="submit" class="login-btn" id="loginBtn">
                    <span>Log In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- feedback message -->
            <div id="loginFeedback"></div>

        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== separate JavaScript ===== -->
    <script src="script.js"></script>
</body>
</html>
